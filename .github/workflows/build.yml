name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -L https://github.com/gbdk-2020/gbdk-2020/releases/latest/download/gbdk-linux64.tar.gz | tar xz
          ./gbdk/bin/lcc -o fortnitegb.gb fortnitegb.c
      - uses: actions/upload-artifact@v4
        with:
          name: fortnitegb
          path: fortnitegb.gb
